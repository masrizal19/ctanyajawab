name: Build & Deploy CTanyaJawab Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Hak akses OIDC dan GitHub Pages yang wajib ada untuk deployment otomatis
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah eksekusi deployment ganda secara bersamaan
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # JOB 1: Build aplikasi Vite / React / SPA
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Vite Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # JOB 2: Deploy Artefak ke GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
